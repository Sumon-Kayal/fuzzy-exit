name: Full corpus check

# tests/run_tests.sh --full calls the real matcher on every one of the
# 456,976 four-character strings in tests/fixtures/, with no sampling.
# That takes on the order of 15 minutes, so it runs weekly and on demand
# rather than on every push - see tests/README.md for what the default
# (sampled) run in ci.yml already covers exhaustively.

on:
  schedule:
    - cron: '0 6 * * 1' # Monday 06:00 UTC
  workflow_dispatch:

jobs:
  full-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run matcher against all 456,976 four-character strings
        run: bash tests/run_tests.sh --full
