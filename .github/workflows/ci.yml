name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck fuzzy-exit.sh install.sh uninstall.sh tests/run_tests.sh tests/install_uninstall_test.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Matcher unit tests
        run: bash tests/run_tests.sh
      - name: Install/uninstall integration test
        run: bash tests/install_uninstall_test.sh

  windows-entrypoints:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Build native installer executable
        shell: pwsh
        run: go build -trimpath -ldflags='-s -w' -o windows/FuzzyExit-1.0-x64.exe ./windows
      - name: Check Windows entry points
        shell: pwsh
        run: |
          $bat = Get-Content ./install.bat -Raw
          $ps = Get-Content ./install.ps1 -Raw
          if ($bat -notmatch '19045' -or $bat -notmatch '22621') { throw 'install.bat is missing the 22H2 build gates' }
          if ($ps -notmatch '19045' -or $ps -notmatch '22621') { throw 'install.ps1 is missing the 22H2 build gates' }
          if ($bat -notmatch 'FuzzyExit-1.0-x64.exe') { throw 'install.bat does not reference the native executable' }
          if ($ps -notmatch 'FuzzyExit-1.0-x64.exe') { throw 'install.ps1 does not reference the native executable' }

  windows-native-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Build Windows x64
        shell: pwsh
        run: go build -trimpath -ldflags='-s -w' -o windows/FuzzyExit-1.0-x64.exe ./windows
      - name: Build Windows ARM64
        shell: pwsh
        run: $env:GOARCH='arm64'; go build -trimpath -ldflags='-s -w' -o windows/FuzzyExit-1.0-arm64.exe ./windows
      - name: Build Windows x86
        shell: pwsh
        run: $env:GOARCH='386'; go build -trimpath -ldflags='-s -w' -o windows/FuzzyExit-1.0-x86.exe ./windows
      - name: Verify PE binaries
        shell: pwsh
        run: |
          if (-not (Test-Path windows/FuzzyExit-1.0-x64.exe)) { throw 'x64 executable missing' }
          if (-not (Test-Path windows/FuzzyExit-1.0-arm64.exe)) { throw 'ARM64 executable missing' }
          if (-not (Test-Path windows/FuzzyExit-1.0-x86.exe)) { throw 'x86 executable missing' }
